---
#-----------------------------------------------------------------------------------------
#
# Проверка сборки и тестов на pull request
#
#-----------------------------------------------------------------------------------------

name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        working-directory: ./backend
        run: dotnet restore Bugget.sln

      - name: Build
        working-directory: ./backend
        run: dotnet build Bugget.sln -c Release --no-restore

      # Интеграционные тесты требуют Docker (Testcontainers) и запускаются отдельно.
      - name: Unit tests
        working-directory: ./backend
        run: |
          dotnet test Bugget.Tests/Bugget.Tests.csproj -c Release --no-build
          dotnet test Users.UnitTests/Users.UnitTests.csproj -c Release --no-build
          dotnet test Authorization.Tests/Authorization.Tests.csproj -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Tests
        working-directory: ./frontend
        run: npm run test
