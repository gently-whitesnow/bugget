---
#-----------------------------------------------------------------------------------------
#
# Проверки качества на pull request.
#
# Набор проверок здесь не описывается: единственный источник правды —
# .quality/quality.config.json, запускает его scripts/quality/verify.sh.
# Ту же команду локально запускают человек и агент.
#
# Шаги ниже только готовят тулчейн (dotnet, node). Новая проверка добавляется
# в конфиг, а не сюда.
#
# Интеграционные тесты (Testcontainers) идут в общем прогоне: на ubuntu-latest демон
# Docker уже стоит, а образы (postgres:17 — тот же, что в deploy, и keycloak) тянет сам
# Testcontainers. Отдельного шага под Docker и кеша образов здесь нет.
#
# Тяжёлые job запускаются по областям: job changes классифицирует изменённые пути и
# включает только затронутые области. Смешанный diff даёт объединение областей, а если
# база diff не вычисляется — включаются обе (fail-open).
#
# Единственный ответ на вопрос «CI прошёл» даёт job ci-ok — его и стоит держать
# required-контекстом в защите main. Прямо обязывать backend и frontend нельзя: они
# зависят от changes, а пропущенный чек для required status checks считается пройденным,
# то есть падение changes открывало бы мёрж вообще без проверок. ci-ok же смотрит на
# фактические результаты зависимостей и краснеет на любом падении или отмене.
# Новая тяжёлая область добавляется в его needs — настройки репозитория трогать не нужно.
#
#-----------------------------------------------------------------------------------------

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Классификация сравнивает HEAD с базой diff, поэтому нужна полная история.
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          backend=false
          frontend=false

          # База diff: для pull_request — merge-base с базовой веткой (весь diff PR,
          # а не последний коммит), для push — состояние ветки до пуша.
          case "$CI_EVENT_NAME" in
            pull_request|pull_request_target) base="${CI_PR_BASE_SHA:-}" ;;
            *) base="${CI_PUSH_BEFORE_SHA:-}" ;;
          esac

          # Пустая, нулевая (первый пуш ветки) или недоступная база — fail-open.
          case "$base" in
            ''|*[!0]*) ;;
            *) base='' ;;
          esac

          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "$base" 2>/dev/null || true
            git cat-file -e "${base}^{commit}" 2>/dev/null || base=''
          fi

          if [ -n "$base" ] && [ "$CI_EVENT_NAME" != "push" ]; then
            base="$(git merge-base "$base" HEAD 2>/dev/null || true)"
          fi

          if [ -z "$base" ]; then
            echo "База diff не вычислена — fail-open, запускаем обе области."
            backend=true
            frontend=true
          else
            files="$(git diff --name-only "$base" HEAD)"
            echo "База diff: $base"
            echo "Изменённые файлы:"
            echo "$files"

            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                # Общие пути: затрагивают обе области.
                specs/contracts/*|scripts/*|.github/workflows/ci.yml|.quality/quality.config.json)
                  backend=true
                  frontend=true
                  ;;
                backend/*|global.json|.config/dotnet-tools.json|.quality/backend-*)
                  backend=true
                  ;;
                frontend/*|.quality/frontend-*)
                  frontend=true
                  ;;
                # Неизвестный файл .quality/** без известного префикса — общий, fail-open.
                .quality/*)
                  backend=true
                  frontend=true
                  ;;
                # Остальное (docs, deploy, landing, README и т.п.) тяжёлые job не запускает.
                *) ;;
              esac
            done <<EOF
          $files
          EOF
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Области: backend=$backend frontend=$frontend"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify
        run: ./scripts/quality/verify.sh --scope backend

      # Отчёт о покрытии нужен и когда прогон красный: по нему выбирают, что покрывать
      # дальше, а гейт backend-coverage краснеет ровно на падении покрытия.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: artifacts/coverage/report
          if-no-files-found: warn
          retention-days: 14

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Verify
        run: ./scripts/quality/verify.sh --scope frontend

  # Агрегирующий гейт: ровно один контекст, по которому судят весь прогон.
  ci-ok:
    needs: [changes, backend, frontend]
    # always() — иначе job сам пропустится вслед за упавшей зависимостью и гейт
    # окажется «пройденным».
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check dependency results
        env:
          # Проверяем needs.<job>.result, а не success(): при if: always() success()
          # не отражает отменённые зависимости.
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_BACKEND: ${{ needs.backend.result }}
          RESULT_FRONTEND: ${{ needs.frontend.result }}
        run: |
          set -uo pipefail

          failed=0

          for entry in "changes:$RESULT_CHANGES" "backend:$RESULT_BACKEND" "frontend:$RESULT_FRONTEND"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            case "$result" in
              # skipped — легальный сценарий: область не затронута классификацией путей.
              success|skipped) echo "$job: $result" ;;
              *) echo "$job: $result — гейт красный"; failed=1 ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "Все области прошли."
