---
#-----------------------------------------------------------------------------------------
#
# Проверки качества на pull request.
#
# Набор проверок здесь не описывается: единственный источник правды —
# .quality/quality.config.json, запускает его scripts/quality/verify.sh.
# Ту же команду локально запускают человек и агент.
#
# Шаги ниже только готовят тулчейн (dotnet, node). Новая проверка добавляется
# в конфиг, а не сюда.
#
#-----------------------------------------------------------------------------------------

name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify
        run: ./scripts/quality/verify.sh --scope backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Verify
        run: ./scripts/quality/verify.sh --scope frontend
