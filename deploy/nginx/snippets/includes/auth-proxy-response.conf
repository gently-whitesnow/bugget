auth_request_set $auth_user_id        $upstream_http_auth_request_user_id;
auth_request_set $auth_workspace_role $upstream_http_auth_request_workspace_role;
auth_request_set $auth_workspace_id   $upstream_http_auth_request_workspace_id;
auth_request_set $auth_team_id        $upstream_http_auth_request_team_id;

proxy_set_header Auth-Request-User-Id        $auth_user_id;
proxy_set_header Auth-Request-Workspace-Role $auth_workspace_role;
proxy_set_header Auth-Request-Workspace-Id   $auth_workspace_id;
proxy_set_header Auth-Request-Team-Id        $auth_team_id;

# --- протаскиваем рефрешенные куки из саб-запроса ---
# Бэкенд пришлёт X-Auth-Set-Cookie-Access/Refresh, когда реально сделал ротацию.
auth_request_set $auth_access_cookie  $upstream_http_x_auth_set_cookie_access;
auth_request_set $auth_refresh_cookie $upstream_http_x_auth_set_cookie_refresh;
auth_request_set $auth_device_id_cookie $upstream_http_x_auth_set_cookie_device_id;

# add_header корректно пропускает пустые значения — пустые хидеры не уйдут.
add_header Set-Cookie $auth_access_cookie  always;
add_header Set-Cookie $auth_refresh_cookie always;
add_header Set-Cookie $auth_device_id_cookie always;