location ~ ^/api/authorization/v[0-9]+/ {
    rewrite ^/api/authorization/(.*)$ /$1 break;
    proxy_pass http://app-api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /auth-proxy {
    internal;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # хэдер по которому мы будем доставать workspace и team id
    proxy_set_header X-Original-URI $request_uri;

   # помечаем саб-запрос
    proxy_set_header X-Auth-Subrequest "1";

    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_pass http://app-api/_internal/auth;
}

location @redirect_to_auth {
    return 302 /login?next=$request_uri;
}

# Для API-запросов: 401 с JSON вместо 302 редиректа.
# XHR прозрачно следует за 302, что ломает фронт — он получает HTML
# логин-страницы вместо JSON. 401 позволяет фронту явно обработать ошибку.
location @api_unauthorized {
    default_type application/json;
    add_header WWW-Authenticate 'Bearer error="invalid_token"' always;
    return 401 '{"error":"unauthorized","login":"/login"}';
}
