location ~ ^/api/users/v[0-9]+/ {
    auth_request /auth-proxy;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_unauthorized;

    # прокидываем заголовки и свежие куки от auth-сервиса
    include /etc/nginx/snippets/includes/auth-proxy-response.conf;

    rewrite ^/api/users/(.*)$ /$1 break;

    proxy_pass http://app-api;
    proxy_http_version 1.1;
    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
}

# users-api для экстеншенов
location ~ ^/api/ext/users/workspaces/[^/]+/teams/[^/]+/v[0-9]+/ {
    auth_request /auth-proxy;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_unauthorized;

    # прокидываем заголовки и свежие куки от auth-сервиса
    include /etc/nginx/snippets/includes/auth-proxy-response.conf;

    rewrite ^/api/ext/users/workspaces/[^/]+/teams/[^/]+/(.*)$ /$1 break;

    proxy_pass http://app-api;
    proxy_http_version 1.1;
    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
}
