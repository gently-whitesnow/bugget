# Обработка API запросов с workspace/team контекстом
location ~ ^/api/app/workspaces/([^/]+)/teams/([^/]+)/v[0-9]+/ {

    # Проверка авторизации
    auth_request /auth-proxy;
    error_page 401 = @api_unauthorized;
    error_page 403 = @api_unauthorized;

    # Забираем и пробрасываем заголовки/куки, которые вернёт auth-сервис при 2xx
    include /etc/nginx/snippets/includes/auth-proxy-response.conf;

    # Убираем workspace/team из пути перед проксированием на backend
    # /api/app/workspaces/7/teams/7/v2/reports -> /v2/reports
    rewrite ^/api/app/workspaces/[^/]+/teams/[^/]+/(.*)$ /$1 break;

    # web sockets
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
    proxy_buffering off;

    # Стандартные прокси-заголовки
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    # Ваш backend API приложения
    proxy_pass http://app-api;
}
