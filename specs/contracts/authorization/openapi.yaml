openapi: 3.0.3

# Контракт модуля Authorization — та его часть, которую зовёт фронт.
# Источник правды для Authorization.Api/Generated/*.g.cs.
#
# Служебные поверхности (`/_internal/auth`, админский вход, ревокация кэша)
# в контракт не входят: их зовут nginx и соседние модули, не фронт.
#
# Правится этот файл, а не .g.cs: перегенерация — scripts/quality/openapi-generate.sh.

info:
  title: Bugget Authorization API
  version: 1.0.0
  description: |-
    Кто я, что мне доступно и выход. Всё остальное про аутентификацию фронт не
    видит: токены живут в cookie, обмен и обновление делает прокси.

paths:

  /v1/auth:
    get:
      operationId: Auth_GetCurrentUser
      summary: Информация об авторизованном пользователе.
      description: |-
        Источник — claims текущего токена, обращений к БД нет.
      responses:
        '200':
          description: Текущий пользователь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Токена нет либо он невалиден.

  /v1/logout:
    post:
      operationId: Auth_Logout
      summary: Выход из системы.
      description: |-
        Отзывает refresh-токен, чистит cookie и отдаёт адрес, куда фронту
        уводить пользователя. Не HTTP-редирект: решение о переходе за фронтом.
      responses:
        '200':
          description: Сессия завершена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
        '401':
          description: Токена нет либо он невалиден.

  /v1/flags:
    get:
      operationId: Flags_GetFlags
      summary: Флаги доступа текущего пользователя.
      responses:
        '200':
          description: Флаги.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flags'
        '401':
          description: Токена нет либо он невалиден.

components:

  schemas:

    AuthUser:
      type: object
      description: Текущий пользователь так, как его видит фронт.
      required:
        - id
      properties:
        id:
          $ref: '../shared.yaml#/components/schemas/UserId'
        team_id:
          type: integer
          nullable: true
          description: Текущая команда. `null` — команда не выбрана.
        workspace_id:
          type: integer
          nullable: true
          description: Текущее рабочее пространство. `null` — не выбрано.
        workspace_role:
          type: string
          nullable: true
          description: Роль в рабочем пространстве.

    LogoutResult:
      type: object
      description: Куда уводить пользователя после выхода.
      required:
        - redirect_url
      properties:
        redirect_url:
          type: string
          description: Адрес страницы входа.

    Flags:
      type: object
      description: Флаги доступа.
      required:
        - beta_test
      properties:
        beta_test:
          type: boolean
          description: Доступны ли пользователю бета-возможности.
