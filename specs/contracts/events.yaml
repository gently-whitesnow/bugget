# Контракт realtime-событий Bugget (SignalR).
#
# Второй публичный контракт фронт↔бек рядом с specs/contracts/**/openapi.yaml. HTTP
# держит гейт backend-contracts, realtime до этого файла не держал ничего: имена событий
# жили строковыми литералами в Bugget/Hubs и в enum SocketEvent на фронте, и разойтись
# они могли молча — компилятор C# и tsc про эту связь не знают.
#
# Файл описывает то, что уже ходит по проводу, и ничего не генерирует. Источник правды
# здесь — сам провод: форму сообщений менять нельзя, фронт стоит в проде у заказчика
# (MAIN-22, ADR-0007).
#
# Проверяет соответствие гейт realtime-contract (scripts/quality/realtime-contract.py).
# Он сверяет четыре стороны и краснеет на расхождении любой:
#
#   1) этот файл;
#   2) объявление публикации в интерфейсе Application-слоя (publisherInterface);
#   3) реализацию-обработчик, которая реально шлёт в группу (publisher);
#   4) подписки фронта — enum SocketEvent и customParsers (subscriber).
#
# Практика: событие добавляют сначала сюда, потом в код. Гейт одинаково красный и когда
# событие описано, но его никто не публикует, и когда публикуется мимо контракта, и когда
# фронт подписан на несуществующее.

version: 1

hubs:
  - name: ReportPageHub
    # Путь виден фронту как /api/app/workspaces/{workspaceId}/teams/{teamId}/v1/report-page-hub —
    # префикс навешивает nginx, в приложении хаб смонтирован по короткому пути.
    path: "/v1/report-page-hub"
    server: backend/Bugget.Api/Hubs/ReportPageHub.cs
    publisherInterface: backend/Bugget.Application/Ports/IReportPageHubClient.cs
    publisher: backend/Bugget.Api/Hubs/ReportPageHubClient.cs
    subscriber: frontend/src/shared/model/socket/contracts.ts
    subscriberEnum: SocketEvent
    description: "Живое обновление страницы репорта. Клиент вступает в группу репорта, сервер рассылает в неё изменения."

    # Клиент → сервер. Фронт зовёт их через conn.invoke.
    methods:
      - name: JoinReportGroupAsync
        description: "Вступить в группу репорта по aliasId. Вызывается заново после каждого переподключения: сервер выдаёт новый connectionId и группы забывает."
      - name: LeaveReportGroupAsync
        description: "Покинуть группу репорта."

    # Отказ метода приезжает клиенту как completion error — это тот же публичный провод,
    # что и события, только в обратную сторону.
    #
    # Строка ошибки состоит из двух слоёв, и первый нам не принадлежит. SignalR всегда
    # оборачивает сообщение HubException своей рамкой:
    #
    #   An unexpected error occurred invoking '<метод>' on the server. <Тип>: <payload>
    #
    # Рамку задаёт фреймворк (`ErrorMessageHelper`), убрать её из хаба нельзя, поэтому
    # она зафиксирована здесь как есть — вместе с именем типа исключения, которое в неё
    # попадает. Наш слой — только payload, хвост после первого `": "`. Форма снята с
    # живого соединения тестом ReportPageHubContractTests, а не выведена из кода.
    #
    # Payload — НЕ RFC 9457: в сокете нет ни Content-Type, ни статуса, ни instance. Общий
    # с HTTP только каталог кодов: `code` совпадает с тем, что клиент увидел бы в
    # problem+json на ту же ошибку (ADR-0008). Имена полей — snake_case, как и у остальных
    # сообщений хаба.
    #
    # Здесь нет деклараций без потребителя — гейт читает каждое поле блока:
    #
    #   fields            сверяются с записью в source;
    #   trustedException  обязан существовать в своём source и наследовать HubException,
    #                     и ровно его — и никакой другой тип — пропускает filter наружу;
    #   envelope          защищён целиком: каждая подстановка ровно одна, порядок
    #                     <method> → <trustedException> → <payload> фиксирован,
    #                     <payload> закрывает строку. Всё, что до него, обязано дословно
    #                     совпадать с ожиданием characterization-теста. Без этих трёх
    #                     требований рамку можно переставить или дописать ей хвост так,
    #                     что сравнению нечего будет проверять.
    #
    # Поэтому изолированная правка любой из четырёх сторон красит гейт: переименовали
    # тип в C#, поменяли текст рамки здесь, поправили ожидание в тесте, ослабили фильтр
    # до базового HubException — красный.
    methodError:
      source: backend/Bugget.Api/Http/RealtimeErrorPayload.cs
      type: RealtimeError
      description: "Ошибка вызова метода хаба. Наружу уходит только payload из каталога: любое другое исключение фильтр сводит к internal_server_error."
      envelope: "An unexpected error occurred invoking '<method>' on the server. <trustedException>: <payload>"
      trustedException:
        source: backend/Bugget.Api/Hubs/RealtimeProblemException.cs
        type: RealtimeProblemException
        filter: backend/Bugget.Api/Middlewares/HubExceptionHandlerFilter.cs
      characterization:
        source: backend/Bugget.IntegrationTests/Contract/ReportPageHubContractTests.cs
        method: JoinReportGroupAsync
      fields:
        - name: code
          type: string
        - name: title
          type: string

    # Сервер → клиент. Порядок аргументов в args — это порядок аргументов в SendAsync,
    # то есть позиционный контракт провода. Типы указаны как в publisherInterface.
    #
    # Событие с одним аргументом фронт разбирает дефолтным правилом «payload — первый
    # аргумент». Событию с двумя и более аргументами обязан соответствовать разборщик
    # в customParsers — иначе фронт молча потеряет всё, кроме первого. Это соответствие
    # тоже проверяет гейт.
    events:
      - name: ReceiveReportPatch
        publisher: SendReportPatchAsync
        description: "Изменение полей репорта: заголовок, статус, ответственный."
        args:
          - name: view
            type: PatchReportSocketView

      - name: ReceiveReportParticipant
        publisher: SendNewReportParticipantAsync
        description: "В репорте появился новый участник, приходит его userId."
        args:
          - name: newParticipant
            type: string

      - name: ReceiveBugCreate
        publisher: SendBugCreateAsync
        description: "В репорте создан баг."
        args:
          - name: summary
            type: BugSummary

      - name: ReceiveBugPatch
        publisher: SendBugPatchAsync
        description: "Изменение полей бага."
        args:
          - name: bugId
            type: int
          - name: patchDto
            type: BugPatchDto

      - name: ReceiveBugAttachmentCreate
        publisher: SendAttachmentCreateAsync
        description: "К багу приложен файл. Ветка attachType = Bug общего метода публикации вложений."
        args:
          - name: attachmentSocketView
            type: AttachmentSocketView

      - name: ReceiveCommentAttachmentCreate
        publisher: SendAttachmentCreateAsync
        description: "К комментарию приложен файл. Ветка attachType = Comment."
        args:
          - name: attachmentSocketView
            type: AttachmentSocketView

      - name: ReceiveBugStepAttachmentCreate
        publisher: SendAttachmentCreateAsync
        description: "К шагу воспроизведения приложен файл. Ветка attachType = BugStep."
        args:
          - name: attachmentSocketView
            type: AttachmentSocketView

      - name: ReceiveBugAttachmentChanged
        publisher: SendAttachmentChangedAsync
        description: "У вложения бага изменилось состояние — например, досчиталось превью."
        args:
          - name: attachmentSocketView
            type: AttachmentSocketView

      - name: ReceiveCommentAttachmentChanged
        publisher: SendAttachmentChangedAsync
        description: "У вложения комментария изменилось состояние."
        args:
          - name: attachmentSocketView
            type: AttachmentSocketView

      - name: ReceiveBugStepAttachmentChanged
        publisher: SendAttachmentChangedAsync
        description: "У вложения шага воспроизведения изменилось состояние."
        args:
          - name: attachmentSocketView
            type: AttachmentSocketView

      - name: ReceiveBugAttachmentDelete
        publisher: SendAttachmentDeleteAsync
        description: "Вложение бага удалено."
        args:
          - name: id
            type: int
          - name: entityId
            type: int
          - name: attachType
            type: int

      - name: ReceiveCommentAttachmentDelete
        publisher: SendAttachmentDeleteAsync
        description: "Вложение комментария удалено."
        args:
          - name: id
            type: int
          - name: entityId
            type: int
          - name: attachType
            type: int

      - name: ReceiveBugStepAttachmentDelete
        publisher: SendAttachmentDeleteAsync
        description: "Вложение шага воспроизведения удалено."
        args:
          - name: id
            type: int
          - name: entityId
            type: int
          - name: attachType
            type: int

      - name: ReceiveCommentCreate
        publisher: SendCommentCreateAsync
        description: "В баге создан комментарий."
        args:
          - name: comment
            type: CommentSummary

      - name: ReceiveCommentUpdate
        publisher: SendCommentUpdateAsync
        description: "Комментарий отредактирован."
        args:
          - name: comment
            type: CommentSummary

      - name: ReceiveCommentDelete
        publisher: SendCommentDeleteAsync
        description: "Комментарий удалён."
        args:
          - name: bugId
            type: int
          - name: commentId
            type: int

      - name: ReceiveReportLinkCreate
        publisher: SendReportLinkCreateAsync
        description: "К репорту добавлена внешняя ссылка."
        args:
          - name: link
            type: ReportLink

      - name: ReceiveReportLinkUpdate
        publisher: SendReportLinkUpdateAsync
        description: "Внешняя ссылка репорта изменена."
        args:
          - name: link
            type: ReportLink

      - name: ReceiveReportLinkDelete
        publisher: SendReportLinkDeleteAsync
        description: "Внешняя ссылка репорта удалена."
        args:
          - name: linkId
            type: int

      - name: ReceiveBugStepCreate
        publisher: SendBugStepCreateAsync
        description: "У бага создан шаг воспроизведения."
        args:
          - name: step
            type: BugStepSummary

      - name: ReceiveBugStepPatch
        publisher: SendBugStepPatchAsync
        description: "Шаг воспроизведения изменён."
        args:
          - name: bugId
            type: int
          - name: step
            type: BugStepSummary

      - name: ReceiveBugStepsOrderUpdate
        publisher: SendBugStepsOrderUpdateAsync
        description: "Изменён порядок шагов воспроизведения, приходит весь набор шагов бага."
        args:
          - name: bugId
            type: int
          - name: steps
            type: BugStepSummary[]

      - name: ReceiveBugStepDelete
        publisher: SendBugStepDeleteAsync
        description: "Шаг воспроизведения удалён."
        args:
          - name: bugId
            type: int
          - name: stepId
            type: int
