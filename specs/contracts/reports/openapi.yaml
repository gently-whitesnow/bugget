components:

  parameters:

    AliasId:
      name: aliasId
      in: path
      required: true
      description: |-
        Адрес репорта в URL. Строка, а не число: это alias вида `<team>-<номер>`,
        по которому фронт строит ссылки.
      schema:
        type: string

    LinkId:
      name: linkId
      in: path
      required: true
      description: Идентификатор ссылки репорта.
      schema:
        type: integer

    BugId:
      name: bugId
      in: path
      required: true
      description: Идентификатор бага внутри репорта.
      schema:
        type: integer

    StepId:
      name: stepId
      in: path
      required: true
      description: Идентификатор шага воспроизведения.
      schema:
        type: integer

    CommentId:
      name: commentId
      in: path
      required: true
      description: Идентификатор комментария.
      schema:
        type: integer

    AttachmentId:
      name: id
      in: path
      required: true
      description: Идентификатор вложения.
      schema:
        type: integer

  schemas:

    # Enum-like значения провода — закрытые множества строк `snake_case`.
    # Внутри домена и в Postgres те же значения остаются числами: перевод
    # числа в строку и обратно живёт ровно на HTTP-границе (ADR-0013).
    # Порядок значений совпадает с числовым представлением домена, но
    # опираться на него нельзя: соответствие задаёт явный маппер.

    ReportStatus:
      type: string
      description: |-
        Статус репорта. Числа домена: `backlog` 0, `resolved` 1, `fix` 2,
        `rejected` 3, `test` 4.
      enum:
        - backlog
        - resolved
        - fix
        - rejected
        - test

    BugStatus:
      type: string
      description: |-
        Статус бага. Числа домена: `open` 0, `verified` 1, `rejected` 2,
        `fixed` 3.
      enum:
        - open
        - verified
        - rejected
        - fixed

    CreatorType:
      type: string
      description: |-
        Тип автора. Числа домена: `user` 0, `system` 1 (журнал действий),
        `tg_beta_tester` 2 (внешний автор через beta-test bot).
      enum:
        - user
        - system
        - tg_beta_tester

    CommentAudience:
      type: string
      description: |-
        Кому виден комментарий: `internal` — команде, `external` — уходит
        внешнему автору. Числа домена: `internal` 0, `external` 1.
      enum:
        - internal
        - external

    AttachType:
      type: string
      description: |-
        К чему прикреплён файл: `fact` — фактический результат, `expected` —
        ожидаемый, `comment` — комментарий, `bug_step` — шаг воспроизведения.
        Числа домена: 0, 1, 2, 3 в том же порядке.
      enum:
        - fact
        - expected
        - comment
        - bug_step

    ReportCreateRequest:
      type: object
      description: Тело создания репорта.
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          description: Заголовок репорта.

    ReportPatchRequest:
      type: object
      description: |
        Поля, помеченные `null`, не интерпретируются как «обнулить значение» —
        это «не трогать».
      properties:
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
          description: Новый заголовок репорта.
        status:
          allOf:
            - $ref: '#/components/schemas/ReportStatus'
          nullable: true
          description: Новый статус репорта.
        responsible_user_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          description: Новый ответственный за репорт.
        is_excluded_from_analytics:
          type: boolean
          nullable: true
          description: |
            Если `true` — репорт исключён из агрегатов аналитического модуля
            (отдельные счётчики, средние, distributions). `false` — учитывается
            (поведение по умолчанию). `null` — не менять текущее значение.

    ReportLinkRequest:
      type: object
      description: Тело создания и обновления ссылки репорта.
      required:
        - link
        - name
      properties:
        link:
          type: string
          minLength: 1
          maxLength: 2048
          description: Адрес ссылки.
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Отображаемое имя ссылки.

    BugRequest:
      type: object
      description: |
        Тело создания бага. Все поля опциональны на уровне транспорта: полноту
        (баг без `receive` и `expect` не имеет смысла) проверяет бизнес-логика
        и отвечает 400 доменной ошибкой.
      properties:
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
          description: Заголовок бага.
        receive:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2048
          description: Фактический результат.
        expect:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2048
          description: Ожидаемый результат.

    BugPatchRequest:
      type: object
      description: Поля бага, которые нужно изменить. Не переданные не меняются.
      properties:
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
          description: Заголовок бага.
        receive:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2048
          description: Фактический результат.
        expect:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2048
          description: Ожидаемый результат.
        status:
          allOf:
            - $ref: '#/components/schemas/BugStatus'
          nullable: true
          description: Новый статус бага.

    BugStepRequest:
      type: object
      description: Тело создания и обновления шага воспроизведения.
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2048
          description: Текст шага.

    BugStepsOrderRequest:
      type: object
      description: Полный список шагов бага в нужном порядке.
      required:
        - step_ids
      properties:
        step_ids:
          type: array
          description: Идентификаторы шагов в новом порядке.
          items:
            type: integer

    AttachmentUpload:
      type: object
      description: Загружаемый файл. Один файл на запрос.
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: Содержимое файла.

    AttachmentRenameRequest:
      type: object
      description: Новое имя вложения.
      required:
        - file_name
      properties:
        file_name:
          type: string
          minLength: 1
          maxLength: 256
          description: Новое имя файла.

    CommentRequest:
      type: object
      description: Тело создания и обновления комментария.
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2048
          description: Текст комментария.
        audience:
          allOf:
            - $ref: '#/components/schemas/CommentAudience'
          nullable: true
          description: |
            `internal` — для команды (по умолчанию), `external` — пересылается
            тестеру. Пропущенное поле трактуется как `internal`.

    ReportCountsScope:
      type: object
      description: |-
        Один срез для счётчика: ключ и фильтры, совпадающие с фильтрами LIST.
      additionalProperties: false
      required:
        - key
      properties:
        key:
          type: string
          description: |-
            Ключ среза. Возвращается в ответе элементом `counts[].key` дословно,
            без преобразования регистра.
        statuses:
          type: array
          nullable: true
          description: Фильтр по статусам репорта.
          items:
            $ref: '#/components/schemas/ReportStatus'
        team_id:
          type: string
          nullable: true
          description: Фильтр по команде-создателю.
        creator_types:
          type: array
          nullable: true
          description: Фильтр по типу создателя.
          items:
            $ref: '#/components/schemas/CreatorType'

    ReportCountsBatchRequest:
      type: object
      description: |
        Набор срезов. Ключи обязаны быть уникальными, срезов не больше 50 —
        иначе 400. Неизвестные поля в теле запрещены.
      additionalProperties: false
      required:
        - scopes
      properties:
        scopes:
          type: array
          description: Срезы, по которым считаются репорты.
          items:
            $ref: '#/components/schemas/ReportCountsScope'

    ReportCountsItem:
      type: object
      description: |-
        Счётчик одного среза. `count` — канонический Int64 строкой
        (см. shared.yaml `Int64String`).
      required:
        - key
        - count
      properties:
        key:
          type: string
          description: |-
            Ключ среза из запроса. Значение переносится дословно: это данные, а не
            имя поля, и конверсия регистра к нему не применяется.
        count:
          $ref: '../shared.yaml#/components/schemas/Int64String'

    ReportCountsBatchResponse:
      type: object
      description: |-
        Счётчики по срезам запроса — массив, а не карта со свободными ключами:
        ключ среза задаёт клиент, а имена полей тела на границе wire↔UI
        преобразуются по регистру. Свободный ключ в объекте неотличим от имени
        поля и был бы преобразован вместе с ними (ADR-0009).
      required:
        - counts
      properties:
        counts:
          type: array
          description: Счётчики в порядке срезов запроса.
          items:
            $ref: '#/components/schemas/ReportCountsItem'

    ReportCountsProblemDetails:
      allOf:
        - $ref: '../shared.yaml#/components/schemas/ProblemDetails'
        - type: object
          properties:
            limit:
              type: integer
              description: Допустимое число срезов в запросе.
            key:
              type: string
              description: Ключ среза, нарушившего ограничение.

    LegacyReportResolve:
      type: object
      description: Координаты репорта для редиректа со старой ссылки.
      required:
        - team_id
        - team_report_id
      properties:
        team_id:
          type: string
          description: Команда-создатель репорта.
        team_report_id:
          type: integer
          description: Номер репорта внутри команды.

    BugStep:
      type: object
      description: Шаг воспроизведения бага.
      required:
        - id
        - bug_id
        - text
        - step_number
        - creator_user_id
        - created_at
        - updated_at
        - attachments
      properties:
        id:
          type: integer
          description: Идентификатор шага.
        bug_id:
          type: integer
          description: Баг, которому принадлежит шаг.
        text:
          type: string
          description: Текст шага.
        step_number:
          type: integer
          description: Порядковый номер шага в баге.
        creator_user_id:
          type: string
          description: Автор шага.
        created_at:
          type: string
          format: date-time
          description: Момент создания.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.
        attachments:
          type: array
          nullable: true
          description: Вложения шага. `null` — не запрашивались.
          items:
            $ref: '#/components/schemas/AttachmentSummary'

    Comment:
      type: object
      description: Комментарий к багу.
      required:
        - id
        - bug_id
        - text
        - creator_user_id
        - creator_type
        - audience
        - created_at
        - updated_at
        - attachments
      properties:
        id:
          type: integer
          description: Идентификатор комментария.
        bug_id:
          type: integer
          description: Баг, которому принадлежит комментарий.
        text:
          type: string
          description: Текст комментария.
        creator_user_id:
          type: string
          description: Автор комментария.
        creator_type:
          $ref: '#/components/schemas/CreatorType'
        audience:
          $ref: '#/components/schemas/CommentAudience'
        created_at:
          type: string
          format: date-time
          description: Момент создания.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.
        attachments:
          type: array
          nullable: true
          description: Вложения комментария. `null` — не запрашивались.
          items:
            $ref: '#/components/schemas/AttachmentSummary'

    Bug:
      type: object
      description: |
        Баг внутри репорта со всем вложенным содержимым.

        `title`, `receive` и `expect` перечислены в `required`, но остаются
        `nullable`: колонки `bugs.title/receive/expect` допускают `NULL`
        (миграция 009 сняла `NOT NULL` с `receive`/`expect`), а бизнес-правило
        требует заполнить хотя бы одно из двух, а не оба. Ключи в ответе при
        этом присутствуют всегда: MVC сериализует `null`.
      required:
        - id
        - report_id
        - title
        - receive
        - expect
        - created_at
        - updated_at
        - creator_user_id
        - status
        - creator_type
        - attachments
        - comments
        - steps
      properties:
        id:
          type: integer
          description: Идентификатор бага.
        report_id:
          type: integer
          description: Репорт, которому принадлежит баг.
        title:
          type: string
          nullable: true
          description: Заголовок бага.
        receive:
          type: string
          nullable: true
          description: Фактический результат.
        expect:
          type: string
          nullable: true
          description: Ожидаемый результат.
        created_at:
          type: string
          format: date-time
          description: Момент создания.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.
        creator_user_id:
          type: string
          description: Автор бага.
        status:
          $ref: '#/components/schemas/BugStatus'
        creator_type:
          $ref: '#/components/schemas/CreatorType'
        attachments:
          type: array
          nullable: true
          description: Вложения бага. `null` — не запрашивались.
          items:
            $ref: '#/components/schemas/AttachmentSummary'
        comments:
          type: array
          nullable: true
          description: Комментарии бага. `null` — не запрашивались.
          items:
            $ref: '#/components/schemas/Comment'
        steps:
          type: array
          nullable: true
          description: Шаги воспроизведения. `null` — не запрашивались.
          items:
            $ref: '#/components/schemas/BugStep'

    BugListItem:
      type: object
      description: |
        Баг в составе элемента списка репортов. От `Bug` отличается отсутствием
        `attachments` и `steps`: LIST их не загружает — карточка репорта в списке
        показывает только статусы багов и количество комментариев.

        `title`, `receive` и `expect` — `required` и `nullable` по той же причине,
        что и в `Bug`.
      required:
        - id
        - report_id
        - title
        - receive
        - expect
        - created_at
        - updated_at
        - creator_user_id
        - status
        - creator_type
        - comments
      properties:
        id:
          type: integer
          description: Идентификатор бага.
        report_id:
          type: integer
          description: Репорт, которому принадлежит баг.
        title:
          type: string
          nullable: true
          description: Заголовок бага.
        receive:
          type: string
          nullable: true
          description: Фактический результат.
        expect:
          type: string
          nullable: true
          description: Ожидаемый результат.
        created_at:
          type: string
          format: date-time
          description: Момент создания.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.
        creator_user_id:
          type: string
          description: Автор бага.
        status:
          $ref: '#/components/schemas/BugStatus'
        creator_type:
          $ref: '#/components/schemas/CreatorType'
        comments:
          type: array
          nullable: true
          description: Комментарии бага. `null` — не запрашивались.
          items:
            $ref: '#/components/schemas/Comment'

    BugSummary:
      type: object
      description: |
        Баг без вложенного содержимого — ответ на создание. Отличается от `Bug`
        отсутствием `report_id` и вложенных коллекций.

        `title`, `receive` и `expect` обязательны по присутствию ключа и при этом
        `nullable` — по той же причине, что и в `Bug`.
      required:
        - id
        - title
        - receive
        - expect
        - created_at
        - updated_at
        - creator_user_id
        - status
        - creator_type
      properties:
        id:
          type: integer
          description: Идентификатор бага.
        title:
          type: string
          nullable: true
          description: Заголовок бага.
        receive:
          type: string
          nullable: true
          description: Фактический результат.
        expect:
          type: string
          nullable: true
          description: Ожидаемый результат.
        created_at:
          type: string
          format: date-time
          description: Момент создания.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.
        creator_user_id:
          type: string
          description: Автор бага.
        status:
          $ref: '#/components/schemas/BugStatus'
        creator_type:
          $ref: '#/components/schemas/CreatorType'

    BugPatchResult:
      type: object
      description: |
        Что изменилось в баге после PATCH.

        `title`, `receive` и `expect` возвращаются как есть из `patch_bug_internal`,
        то есть могут быть `null`: баг заводят с одним заполненным полем из пары
        `receive`/`expect`, и PATCH второго не заполняет. Ключи присутствуют всегда.
      required:
        - id
        - title
        - receive
        - expect
        - updated_at
        - status
      properties:
        id:
          type: integer
          description: Идентификатор бага.
        title:
          type: string
          nullable: true
          description: Заголовок бага.
        receive:
          type: string
          nullable: true
          description: Фактический результат.
        expect:
          type: string
          nullable: true
          description: Ожидаемый результат.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.
        status:
          $ref: '#/components/schemas/BugStatus'

    CommentSummary:
      type: object
      description: |
        Комментарий без вложений — ответ на создание и обновление. Отличается от
        `Comment` отсутствием `attachments`.
      required:
        - id
        - bug_id
        - text
        - creator_user_id
        - creator_type
        - audience
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: Идентификатор комментария.
        bug_id:
          type: integer
          description: Баг, которому принадлежит комментарий.
        text:
          type: string
          description: Текст комментария.
        creator_user_id:
          type: string
          description: Автор комментария.
        creator_type:
          $ref: '#/components/schemas/CreatorType'
        audience:
          $ref: '#/components/schemas/CommentAudience'
        created_at:
          type: string
          format: date-time
          description: Момент создания.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.

    AttachmentSummary:
      type: object
      description: |
        Публичная форма вложения: только то, что нужно клиенту для отображения
        и скачивания. Поля хранилища (`storage_key`, `storage_kind`,
        `length_bytes`, `mime_type`, `is_gzip_compressed`) наружу не уходят.

        Единая форма для всех вложений модуля: и для ручек загрузки и
        переименования, и для вложений внутри репорта.
      required:
        - id
        - entity_id
        - attach_type
        - created_at
        - creator_user_id
        - file_name
        - has_preview
      properties:
        id:
          type: integer
          description: Идентификатор вложения.
        entity_id:
          type: integer
          description: Идентификатор сущности, к которой прикреплён файл.
        attach_type:
          $ref: '#/components/schemas/AttachType'
        created_at:
          type: string
          format: date-time
          description: Момент загрузки.
        creator_user_id:
          type: string
          description: Кто загрузил вложение.
        file_name:
          type: string
          description: Имя файла.
        has_preview:
          type: boolean
          description: Есть ли превью-версия.

    ReportLink:
      type: object
      description: Внешняя ссылка, прикреплённая к репорту.
      required:
        - id
        - report_id
        - link
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: Идентификатор ссылки.
        report_id:
          type: integer
          description: Репорт, которому принадлежит ссылка.
        link:
          type: string
          description: Адрес ссылки.
        name:
          type: string
          description: Отображаемое имя ссылки.
        created_at:
          type: string
          format: date-time
          description: Момент создания.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.

    ReportSummary:
      type: object
      description: Репорт без вложенного содержимого — ответ на создание.
      required:
        - id
        - title
        - status
        - responsible_user_id
        - past_responsible_user_id
        - creator_user_id
        - creator_team_id
        - created_at
        - updated_at
        - creator_type
      properties:
        id:
          type: string
          description: Адрес репорта — тот же alias, что и в URL.
        title:
          type: string
          description: Заголовок репорта.
        status:
          $ref: '#/components/schemas/ReportStatus'
        responsible_user_id:
          type: string
          description: Текущий ответственный.
        past_responsible_user_id:
          type: string
          description: Предыдущий ответственный.
        creator_user_id:
          type: string
          description: Автор репорта.
        creator_team_id:
          type: string
          nullable: true
          description: Команда автора.
        created_at:
          type: string
          format: date-time
          description: Момент создания.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.
        creator_type:
          $ref: '#/components/schemas/CreatorType'

    ReportPatchResult:
      type: object
      description: Что изменилось в репорте после PATCH.
      required:
        - id
        - title
        - status
        - responsible_user_id
        - past_responsible_user_id
        - updated_at
      properties:
        id:
          type: string
          description: Адрес репорта — тот же alias, что и в URL.
        title:
          type: string
          description: Заголовок репорта.
        status:
          $ref: '#/components/schemas/ReportStatus'
        responsible_user_id:
          type: string
          description: Текущий ответственный.
        past_responsible_user_id:
          type: string
          description: Предыдущий ответственный.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.

    Report:
      type: object
      description: Репорт со всем содержимым страницы.
      required:
        - id
        - title
        - status
        - responsible_user_id
        - past_responsible_user_id
        - creator_user_id
        - creator_team_id
        - created_at
        - updated_at
        - creator_type
        - is_excluded_from_analytics
        - participants_user_ids
        - links
        - bugs
      properties:
        id:
          type: string
          description: Адрес репорта — тот же alias, что и в URL.
        title:
          type: string
          description: Заголовок репорта.
        status:
          $ref: '#/components/schemas/ReportStatus'
        responsible_user_id:
          type: string
          description: Текущий ответственный.
        past_responsible_user_id:
          type: string
          description: Предыдущий ответственный.
        creator_user_id:
          type: string
          description: Автор репорта.
        creator_team_id:
          type: string
          nullable: true
          description: Команда автора.
        created_at:
          type: string
          format: date-time
          description: Момент создания.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.
        creator_type:
          $ref: '#/components/schemas/CreatorType'
        is_excluded_from_analytics:
          type: boolean
          description: Исключён ли репорт из агрегатов аналитики.
        participants_user_ids:
          type: array
          description: Все, кто участвовал в репорте.
          items:
            type: string
        links:
          type: array
          nullable: true
          description: Ссылки репорта. `null` — не запрашивались.
          items:
            $ref: '#/components/schemas/ReportLink'
        bugs:
          type: array
          nullable: true
          description: Баги репорта. `null` — не запрашивались.
          items:
            $ref: '#/components/schemas/Bug'

    ReportListItem:
      type: object
      description: |
        Репорт в составе страницы списка. От `Report` отличается отсутствием
        `links`: LIST их не загружает, и наружу они уходили только как `null`.
      required:
        - id
        - title
        - status
        - responsible_user_id
        - past_responsible_user_id
        - creator_user_id
        - creator_team_id
        - created_at
        - updated_at
        - creator_type
        - is_excluded_from_analytics
        - participants_user_ids
        - bugs
      properties:
        id:
          type: string
          description: Адрес репорта — тот же alias, что и в URL.
        title:
          type: string
          description: Заголовок репорта.
        status:
          $ref: '#/components/schemas/ReportStatus'
        responsible_user_id:
          type: string
          description: Текущий ответственный.
        past_responsible_user_id:
          type: string
          description: Предыдущий ответственный.
        creator_user_id:
          type: string
          description: Автор репорта.
        creator_team_id:
          type: string
          nullable: true
          description: Команда автора.
        created_at:
          type: string
          format: date-time
          description: Момент создания.
        updated_at:
          type: string
          format: date-time
          description: Момент последнего изменения.
        creator_type:
          $ref: '#/components/schemas/CreatorType'
        is_excluded_from_analytics:
          type: boolean
          description: Исключён ли репорт из агрегатов аналитики.
        participants_user_ids:
          type: array
          description: Все, кто участвовал в репорте.
          items:
            type: string
        bugs:
          type: array
          nullable: true
          description: Баги репорта. `null` — не запрашивались.
          items:
            $ref: '#/components/schemas/BugListItem'

    ReportList:
      type: object
      description: |-
        Страница списка репортов. `total` — канонический Int64 строкой
        (см. shared.yaml `Int64String`): сколько всего репортов подходит
        под фильтры.
      required:
        - total
        - reports
      properties:
        total:
          $ref: '../shared.yaml#/components/schemas/Int64String'
        reports:
          type: array
          description: Репорты текущей страницы.
          items:
            $ref: '#/components/schemas/ReportListItem'

    PhaseName:
      type: string
      description: Имя фазы жизненного цикла репорта.
      enum:
        - Test
        - Fix

    AnalyticsReportPhaseEntry:
      type: object
      description: Один интервал фазы в таймлайне репорта.
      required:
        - phase
        - entered_at
        - exited_at
        - duration_days
        - regression_cycle_index
      properties:
        phase:
          $ref: '#/components/schemas/PhaseName'
        entered_at:
          type: string
          format: date-time
          description: Момент входа в фазу.
        exited_at:
          type: string
          format: date-time
          nullable: true
          description: Момент выхода из фазы. `null` — если фаза ещё активна.
        duration_days:
          type: number
          nullable: true
          description: |
            Длительность фазы в днях. `null` для активной фазы (`exited_at == null`).
        regression_cycle_index:
          type: integer
          description: |
            Индекс цикла, к которому относится фаза (0 — первичный проход,
            1 — первый retest и т.д.).

    AnalyticsReportBugsByStatus:
      type: object
      description: Снимок распределения багов репорта по статусам на момент запроса.
      required:
        - open
        - fixed
        - verified
        - rejected
      properties:
        open:
          type: integer
          description: Багов в статусе `open`.
        fixed:
          type: integer
          description: Багов в статусе `fixed`.
        verified:
          type: integer
          description: Багов в статусе `verified`.
        rejected:
          type: integer
          description: Багов в статусе `rejected`.

    AnalyticsReport:
      type: object
      description: |-
        Детальная фазовая аналитика одного репорта. `report_id` —
        канонический Int64 строкой (см. shared.yaml `Int64String`).
      required:
        - report_id
        - phase_timeline
        - regression_cycles
        - bugs_by_status
        - bugs_added_during_regression
      properties:
        report_id:
          $ref: '../shared.yaml#/components/schemas/Int64String'
        phase_timeline:
          type: array
          description: Полный таймлайн фаз в порядке возрастания `entered_at`.
          items:
            $ref: '#/components/schemas/AnalyticsReportPhaseEntry'
        regression_cycles:
          type: integer
          description: |
            Кол-во полных regression-циклов (Test → Fix → Test). 0 — репорт
            прошёл по «прямому» пути.
        bugs_by_status:
          $ref: '#/components/schemas/AnalyticsReportBugsByStatus'
        bugs_added_during_regression:
          type: integer
          description: |
            Сколько багов добавлено в репорт во время повторных Test-фаз
            (regression_cycle_index ≥ 1).

  responses:

    AttachmentContent:
      description: |-
        Содержимое файла. Content-Type — MIME сохранённого вложения, для сжатых
        вложений добавляется `Content-Encoding: gzip`.
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary

    BadRequest:
      description: Некорректные параметры запроса.
      content:
        application/problem+json:
          schema:
            $ref: '../shared.yaml#/components/schemas/ProblemDetails'
    CountsBadRequest:
      description: Некорректный батч срезов.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ReportCountsProblemDetails'

    NotFound:
      description: |-
        Репорт не найден. Тот же ответ отдаётся на репорт чужой команды или
        организации: существование чужого репорта не раскрывается.
      content:
        application/problem+json:
          schema:
            $ref: '../shared.yaml#/components/schemas/ProblemDetails'

    Unauthorized:
      description: Запрос без действующей identity либо с недействительной сессией.
      content:
        application/problem+json:
          schema:
            $ref: '../shared.yaml#/components/schemas/ProblemDetails'

    InternalServerError:
      description: |-
        Внутренняя ошибка сервера. Тело не раскрывает деталей: `detail` для 5xx не
        публикуется, для корреляции с журналом служит `traceId`.
      content:
        application/problem+json:
          schema:
            $ref: '../shared.yaml#/components/schemas/ProblemDetails'
