openapi: 3.0.3

# Контракт модуля Reports. Источник правды для Bugget/Generated/ReportsControllerBase.g.cs
# и Bugget.Reports.Contracts/Generated/ReportsContracts.g.cs.
#
# Документ описывает три контроллера: Reports, ReportCounts и ReportLinks. Разделение
# идёт по префиксу operationId (`Reports_`, `ReportCounts_`, `ReportLinks_`) — NSwag
# генерирует по абстрактной базе на префикс, а DTO остаются общими на весь модуль.
#
# Контракт снят с работающего API: пути, имена query-параметров и формы ответов
# описаны так, как их видит фронт. Отступления от канона AIP перечислены
# в specs/ADR/0005-contract-first-openapi.md — они чинятся отдельными задачами,
# а не по ходу описания. Единственное осознанное сужение формы относительно снятой —
# вложения и элемент списка репортов, см. там же «Сужение wire-контракта reports».
#
# Правится этот файл, а не .g.cs: перегенерация — scripts/quality/openapi-generate.sh.
# Порядок схем в components/schemas определяет порядок типов в сгенерированном файле.

info:
  title: Bugget Reports API
  version: 1.0.0
  description: |-
    Репорты, их счётчики и ссылки. Репорт — корневая сущность продукта: страница
    репорта показывает вложенные баги, их шаги, комментарии и вложения.

paths:

  /v2/reports:
    post:
      operationId: Reports_CreateReport
      summary: Создать репорт.
      description: |-
        Автор и команда берутся из identity, в теле — только заголовок.
        Возвращает созданный репорт и внешний origin-relative путь к нему.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreateRequest'
      responses:
        '201':
          description: Репорт создан.
          headers:
            Location:
              required: true
              description: Внешний origin-relative API-путь созданного репорта.
              schema:
                type: string
                example: /api/app/workspaces/1/teams/2/v2/reports/team-42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: Reports_ListReports
      summary: Список репортов для главной страницы.
      description: |-
        Фильтры и пагинация — параметрами запроса. Имена параметров исторически
        в camelCase, менять их нельзя: по ним ходит фронт.
      parameters:
        - name: userId
          in: query
          required: false
          description: Фильтр по ответственному или участнику.
          schema:
            type: string
            nullable: true
        - name: teamId
          in: query
          required: false
          description: Фильтр по команде-создателю.
          schema:
            type: string
            nullable: true
        - name: reportStatuses
          in: query
          required: false
          description: Фильтр по статусам репорта.
          schema:
            type: array
            nullable: true
            items:
              $ref: '#/components/schemas/ReportStatus'
        - name: creatorTypes
          in: query
          required: false
          description: Фильтр по типу создателя.
          schema:
            type: array
            nullable: true
            items:
              $ref: '#/components/schemas/CreatorType'
        - name: skip
          in: query
          required: false
          description: Сколько записей пропустить.
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: take
          in: query
          required: false
          description: Размер страницы.
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Страница репортов и общее количество.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}:
    get:
      operationId: Reports_GetReport
      summary: Получить репорт со всем содержимым.
      description: |-
        Отдаёт репорт вместе с багами, их шагами, комментариями и вложениями —
        одним запросом на всю страницу репорта.
      parameters:
        - $ref: '#/components/parameters/AliasId'
      responses:
        '200':
          description: Репорт найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: Reports_PatchReport
      summary: Частичное обновление репорта.
      description: |-
        Поля, не переданные в теле (или переданные как `null`), не меняются —
        это «не трогать», а не «обнулить».
      parameters:
        - $ref: '#/components/parameters/AliasId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPatchRequest'
      responses:
        '200':
          description: Репорт обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/legacy/{legacyId}:
    get:
      operationId: Reports_ResolveLegacyReport
      summary: Разрешить legacy-идентификатор репорта.
      description: |-
        Отдаёт `team_id` и `team_report_id`, по которым фронт строит редирект
        со старой ссылки на текущий адрес репорта.
      parameters:
        - name: legacyId
          in: path
          required: true
          description: Сквозной идентификатор репорта из старой схемы адресов.
          schema:
            type: integer
      responses:
        '200':
          description: Идентификатор разрешён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyReportResolve'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Репорт не найден либо у него нет команды и номера в команде.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{id}/analytics:
    get:
      operationId: Reports_GetReportAnalytics
      summary: Детальная фазовая аналитика конкретного репорта.
      description: |-
        Полный таймлайн фаз (Test/Fix), счётчик regression-циклов и
        распределение багов по статусам на момент запроса.
        Sub-resource на репорте: семантически аналитика принадлежит
        конкретному репорту, потому живёт под `/v2/reports/{id}/`.
      parameters:
        - name: id
          in: path
          required: true
          description: |-
            Идентификатор репорта. Строка канонического Int64
            (см. shared.yaml `Int64String`).
          schema:
            $ref: '../shared.yaml#/components/schemas/Int64String'
      responses:
        '200':
          description: Аналитика по репорту собрана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/counts:batch:
    post:
      operationId: ReportCounts_CountReportsBatch
      summary: Батч-счётчики репортов по нескольким срезам.
      description: |-
        Один запрос вместо N — фронт показывает счётчики всех вкладок сразу.
        Организация всегда берётся из identity, в теле её нет.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCountsBatchRequest'
      responses:
        '200':
          description: Счётчики по ключам из запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCountsBatchResponse'
        '400':
          $ref: '#/components/responses/CountsBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/links:
    post:
      operationId: ReportLinks_CreateReportLink
      summary: Добавить ссылку к репорту.
      parameters:
        - $ref: '#/components/parameters/AliasId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportLinkRequest'
      responses:
        '201':
          description: Ссылка добавлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/links/{linkId}:
    put:
      operationId: ReportLinks_UpdateReportLink
      summary: Обновить ссылку репорта.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/LinkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportLinkRequest'
      responses:
        '200':
          description: Ссылка обновлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: ReportLinks_DeleteReportLink
      summary: Удалить ссылку репорта.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: Ссылка удалена. Тело пустое.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/reports/search:
    get:
      operationId: Search_SearchReports
      summary: Полнотекстовый поиск по репортам.
      description: |-
        Отдаёт ту же форму, что и список репортов, поэтому живёт в контракте
        модуля reports, хотя путь остался в `/v1`. Имена параметров исторически
        в camelCase, менять их нельзя: по ним ходит фронт.
      parameters:
        - name: query
          in: query
          required: false
          description: Поисковая строка. Пустая — фильтрация без текстового поиска.
          schema:
            type: string
            nullable: true
        - name: reportStatuses
          in: query
          required: false
          description: Фильтр по статусам репорта.
          schema:
            type: array
            nullable: true
            items:
              $ref: '#/components/schemas/ReportStatus'
        - name: userId
          in: query
          required: false
          description: Фильтр по ответственному или участнику.
          schema:
            type: string
            nullable: true
        - name: teamId
          in: query
          required: false
          description: Фильтр по команде-создателю.
          schema:
            type: string
            nullable: true
        - name: sort
          in: query
          required: false
          description: Порядок сортировки результатов.
          schema:
            type: string
            nullable: true
        - name: skip
          in: query
          required: false
          description: Сколько записей пропустить.
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: take
          in: query
          required: false
          description: Размер страницы.
          schema:
            type: integer
            default: 10
            minimum: 0
        - name: creatorTypes
          in: query
          required: false
          description: Фильтр по типу создателя.
          schema:
            type: array
            nullable: true
            items:
              $ref: '#/components/schemas/CreatorType'
      responses:
        '200':
          description: Страница найденных репортов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/bugs:
    post:
      operationId: Bugs_CreateBug
      summary: Добавить баг в репорт.
      parameters:
        - $ref: '#/components/parameters/AliasId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BugRequest'
      responses:
        '201':
          description: Баг добавлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/bugs/{bugId}:
    patch:
      operationId: Bugs_PatchBug
      summary: Частичное обновление бага.
      description: |-
        Не переданные поля не меняются. Смена `status` переводит баг по его
        жизненному циклу и может двигать фазу репорта.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/BugId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BugPatchRequest'
      responses:
        '200':
          description: Баг обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugPatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/bugs/{bugId}/steps:
    post:
      operationId: BugSteps_CreateBugStep
      summary: Добавить шаг воспроизведения.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/BugId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BugStepRequest'
      responses:
        '201':
          description: Шаг добавлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugStep'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/bugs/{bugId}/steps/order:
    put:
      operationId: BugSteps_UpdateBugStepsOrder
      summary: Переупорядочить шаги воспроизведения.
      description: |-
        Порядок задаётся полным списком идентификаторов шагов. В ответе — шаги
        в новом порядке.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/BugId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BugStepsOrderRequest'
      responses:
        '200':
          description: Новый порядок применён.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BugStep'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/bugs/{bugId}/steps/{stepId}:
    patch:
      operationId: BugSteps_PatchBugStep
      summary: Изменить текст шага.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/BugId'
        - $ref: '#/components/parameters/StepId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BugStepRequest'
      responses:
        '200':
          description: Шаг обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugStep'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: BugSteps_DeleteBugStep
      summary: Удалить шаг.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/BugId'
        - $ref: '#/components/parameters/StepId'
      responses:
        '200':
          description: Шаг удалён. Тело пустое.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/bugs/{bugId}/comments:
    post:
      operationId: Comments_CreateComment
      summary: Добавить комментарий к багу.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/BugId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '201':
          description: Комментарий добавлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/bugs/{bugId}/comments/{commentId}:
    put:
      operationId: Comments_UpdateComment
      summary: Обновить свой комментарий.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/BugId'
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200':
          description: Комментарий обновлён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: Comments_DeleteComment
      summary: Удалить свой комментарий.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/BugId'
        - $ref: '#/components/parameters/CommentId'
      responses:
        '200':
          description: Комментарий удалён. Тело пустое.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/bugs/{bugId}/attachments:
    post:
      operationId: BugAttachments_CreateBugAttachment
      summary: Загрузить вложение к багу.
      description: |-
        Тело — `multipart/form-data` с одним файлом. MIME определяется по
        содержимому, а не по заголовку клиента (кроме development-окружения).
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/BugId'
        - name: attachType
          in: query
          required: true
          description: |-
            К чему относится вложение. Ручка бага принимает только `fact` и
            `expected`; `comment` и `bug_step` сервер выводит из маршрута и
            здесь отклоняет.
          schema:
            $ref: '#/components/schemas/AttachType'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUpload'
      responses:
        '201':
          description: Вложение сохранено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/bugs/{bugId}/attachments/{id}:
    patch:
      operationId: BugAttachments_RenameBugAttachment
      summary: Переименовать вложение бага.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/BugId'
        - $ref: '#/components/parameters/AttachmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentRenameRequest'
      responses:
        '200':
          description: Вложение переименовано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: BugAttachments_DeleteBugAttachment
      summary: Удалить вложение бага.
      parameters:
        - $ref: '#/components/parameters/AliasId'
        - $ref: '#/components/parameters/BugId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: Вложение удалено. Тело пустое.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v2/reports/{aliasId}/bugs/{bugId}/attachments/{id}/content:
    get:
      operationId: BugAttachments_GetBugAttachmentContent
