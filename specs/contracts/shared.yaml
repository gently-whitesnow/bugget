openapi: 3.0.3

# Общие компоненты контрактов Bugget.
#
# Файл не описывает эндпоинтов — только схемы, переиспользуемые несколькими
# модулями. Модульные контракты ссылаются сюда относительным $ref:
#   $ref: '../shared.yaml#/components/schemas/ErrorResponse'
#
# Правило reuse-first: прежде чем заводить новую схему в модуле, проверь, нет ли
# подходящей здесь. Новый общий тип добавляется сюда, а не копируется в модули.

info:
  title: Bugget shared contracts
  version: 1.0.0
  description: Общие схемы контрактов Bugget.

paths: {}

components:
  schemas:

    ProblemDetails:
      type: object
      description: |
        RFC 9457 Problem Details. `type` и машинный `code` всегда выводятся из
        одного дескриптора: `urn:bugget:error:<code>`.
      required:
        - type
        - title
        - status
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Стабильный машинно-читаемый код ошибки.
        traceId:
          type: string
          description: Идентификатор трассы для корреляции с журналом.
        errors:
          type: object
          description: Wire-имена полей тела запроса, которые отправляет клиент.
          additionalProperties:
            type: array
            items:
              type: string

    Period:
      type: object
      description: Полузакрытый интервал времени [from; to). `label` — короткое имя для UI/логов.
      required:
        - from
        - to
        - label
      properties:
        from:
          type: string
          format: date-time
          description: Нижняя граница (включительно).
        to:
          type: string
          format: date-time
          description: Верхняя граница (исключительно).
        label:
          type: string
          description: Человекочитаемый ярлык периода.

    UserId:
      type: string
      description: |-
        Идентификатор пользователя. Строка, а не число: источник — внешний
        провайдер аутентификации, формат идентификатора им и определяется.

    Int64String:
      type: string
      description: |-
        Неотрицательное 64-битное целое на проводе — строкой, а не числом.

        Причина: у API ровно один клиент, и в нём JSON-число это IEEE-754
        double. Всё, что больше 2^53−1, теряет точность молча:
        `9007199254740993` доезжает как `9007199254740992`, и ссылка,
        ключ списка и запрос уходят на соседнюю запись. `format: int64`
        в публичном контракте описывал ровно эту дыру.

        Канон провода: `0` либо `[1-9][0-9]*` — без знака, ведущих нулей,
        экспоненты, разделителей и пробелов. OpenAPI ограничивает лексическую
        форму и длину; точный диапазон `0..9223372036854775807` проверяет
        HTTP-граница `WireInt64` при разборе path и построении response.
      pattern: '^(0|[1-9][0-9]*)$'
      maxLength: 19

  responses:
    Problem:
      description: Ошибка обработки запроса.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
