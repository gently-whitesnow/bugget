openapi: 3.0.3

# Общие компоненты контрактов Bugget.
#
# Файл не описывает эндпоинтов — только схемы, переиспользуемые несколькими
# модулями. Модульные контракты ссылаются сюда относительным $ref:
#   $ref: '../shared.yaml#/components/schemas/ErrorResponse'
#
# Правило reuse-first: прежде чем заводить новую схему в модуле, проверь, нет ли
# подходящей здесь. Новый общий тип добавляется сюда, а не копируется в модули.

info:
  title: Bugget shared contracts
  version: 1.0.0
  description: Общие схемы контрактов Bugget.

paths: {}

components:
  schemas:

    ProblemDetails:
      type: object
      description: |
        RFC 9457 Problem Details. `type` и машинный `code` всегда выводятся из
        одного дескриптора: `urn:bugget:error:<code>`.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Стабильный машинно-читаемый код ошибки.
        traceId:
          type: string
          description: Идентификатор трассы для корреляции с журналом.
        limit:
          type: integer
          description: Допустимое число элементов в запросе.
        key:
          type: string
          description: Ключ элемента, нарушившего ограничение.

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              description: Имена полей в ModelState после ASP.NET model binding.
              additionalProperties:
                type: array
                items:
                  type: string

    Period:
      type: object
      description: Полузакрытый интервал времени [from; to). `label` — короткое имя для UI/логов.
      required:
        - from
        - to
        - label
      properties:
        from:
          type: string
          format: date-time
          description: Нижняя граница (включительно).
        to:
          type: string
          format: date-time
          description: Верхняя граница (исключительно).
        label:
          type: string
          description: Человекочитаемый ярлык периода.

    UserId:
      type: string
      description: |-
        Идентификатор пользователя. Строка, а не число: источник — внешний
        провайдер аутентификации, формат идентификатора им и определяется.

  responses:
    Problem:
      description: Ошибка обработки запроса.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationProblem:
      description: Ошибка валидации параметров или тела запроса.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
